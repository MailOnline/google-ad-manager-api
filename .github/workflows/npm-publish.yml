name: Release

on:
  push:
    branches: [master]

jobs:
  release-github:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: MailOnline/workflows/release-please@master
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release-npm:
    needs: release-github
    if: needs.release-github.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: MailOnline/workflows/checkout@master
      - uses: MailOnline/workflows/npm-install@master
      - run: npm run build
      - run: npm test
        env:
          JWT_EMAIL: ${{ secrets.JWT_EMAIL }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          NETWORK_CODE: ${{ secrets.NETWORK_CODE }}
      - run: npm publish --access public
