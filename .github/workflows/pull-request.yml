name: Pull Request

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: dmg-arc-ubuntu
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: MailOnline/workflows/checkout@master
      - uses: MailOnline/workflows/npm-install@master
      - run: npm run build
      - run: npm test
        env:
          JWT_EMAIL: ${{ secrets.JWT_EMAIL }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          NETWORK_CODE: ${{ secrets.NETWORK_CODE }}
